<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Especialidade</title>
</head>
<body>
<p><a th:href="@{/especialidades}">&larr; Voltar</a></p>
<h1 th:text="${id == null} ? 'Nova especialidade' : 'Editar especialidade'"></h1>

<form th:object="${formulario}"
      th:action="${id == null} ? @{/especialidades} : @{/especialidades/{id}/editar(id=${id})}"
      method="post">
    <p>
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" th:field="*{nome}" maxlength="100" size="40">
        <br><span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" style="color:red"></span>
    </p>
    <button type="submit">Salvar</button>
</form>
</body>
</html>
