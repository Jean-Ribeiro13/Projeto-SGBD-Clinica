<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar usuário | Clínica Médica</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            max-width: 520px;
        }

        label {
            display: block;
            margin-top: 16px;
        }

        input, select {
            box-sizing: border-box;
            padding: 8px;
            width: 100%;
            margin-top: 5px;
        }

        button {
            margin-top: 20px;
            padding: 9px 16px;
        }

        .erro {
            color: #a40000;
        }

        .sucesso {
            color: #176b2c;
        }
    </style>
</head>
<body>
<main>
    <h1>Cadastrar usuário</h1>
    <p>Esta área é exclusiva para administradores.</p>
    <p class="erro" th:if="${erro}" th:text="${erro}" role="alert"></p>
    <p class="sucesso" th:if="${sucesso}" th:text="${sucesso}" role="status"></p>

    <form th:action="@{/usuarios}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <label for="login">Login</label>
        <input id="login" name="login" type="text" minlength="3" maxlength="50"
               pattern="[A-Za-z0-9._-]{3,50}" autocomplete="username" required>

        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" minlength="8" maxlength="100"
               autocomplete="new-password" required>

        <label for="confirmarSenha">Confirmar senha</label>
        <input id="confirmarSenha" name="confirmarSenha" type="password" minlength="8" maxlength="100"
               autocomplete="new-password" required>

        <label for="perfil">Perfil</label>
        <select id="perfil" name="perfil" required>
            <option value="" disabled selected>Selecione um perfil</option>
            <option th:each="perfil : ${perfis}" th:value="${perfil}"
                    th:text="${#strings.capitalize(perfil)}"></option>
        </select>

        <button type="submit">Cadastrar usuário</button>
    </form>
    <p><a th:href="@{/}">Voltar ao início</a></p>
</main>
</body>
</html>
