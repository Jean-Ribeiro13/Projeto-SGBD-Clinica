<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${titulo}">Especialidade</title>

    <style>
/* =================================
   INTEGRAMED - ESPECIALIDADE
================================= */

.especialidade-page {
    --azul: #1e5abb;
    --azul-claro: #f3f8ff;
    --coral: #fe5266;
    --texto: #26374a;
    --texto-suave: #64748b;
    --borda: #dce5ef;

    min-height: 100vh;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(circle at 10% 15%, rgba(143, 198, 255, 0.35), transparent 30%),
        radial-gradient(circle at 90% 85%, rgba(254, 82, 102, 0.10), transparent 28%),
        #f1f6fc;

    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
    color: var(--texto);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

.especialidade-page * { box-sizing: border-box; }

.especialidade-container {
    width: 100%;
    max-width: 1050px;
    margin: auto;
}

/* A altura do cartão acompanha o conteúdo, sem espaço vazio forçado */
.especialidade-card {
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    background: #fff;
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(30, 90, 187, 0.13);
}

/* =================================
   ÁREA DO FORMULÁRIO
================================= */

/* Conteúdo alinhado ao topo, com o "Voltar" sempre na mesma posição */
.especialidade-form-area {
    padding: 45px 65px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
}

.especialidade-page .link-voltar {
    display: inline-flex;
    align-items: center;
    align-self: flex-start;
    gap: 9px;
    margin: 0 0 32px;
    padding: 10px 16px;
    border: 1px solid #dce8f7;
    border-radius: 9px;
    background: var(--azul-claro);
    color: var(--azul);
    font-size: 14px;
    font-weight: 650;
    text-decoration: none;
    transition: background 0.2s, transform 0.2s;
}

.especialidade-page .link-voltar span { font-size: 19px; line-height: 1; }

.especialidade-page .link-voltar:hover {
    background: #e5f0ff;
    transform: translateX(-3px);
}

.form-header { margin-bottom: 26px; }

.form-tag {
    display: inline-block;
    margin-bottom: 12px;
    padding: 5px 11px;
    border-radius: 20px;
    background: var(--azul-claro);
    color: var(--azul);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.3px;
}

.form-header h1 {
    margin: 0 0 10px;
    color: var(--azul);
    font-size: 31px;
    font-weight: 750;
    letter-spacing: -0.8px;
}

.form-header p {
    margin: 0;
    max-width: 52ch;
    color: var(--texto-suave);
    font-size: 14px;
    line-height: 1.7;
}

/* Campo */

.especialidade-form { width: 100%; }

.form-group { margin-bottom: 18px; }

.form-group label {
    display: block;
    margin-bottom: 8px;
    color: #34465d;
    font-size: 14px;
    font-weight: 650;
}

.form-group input {
    width: 100%;
    height: 49px;
    padding: 0 15px;
    border: 1px solid var(--borda);
    border-radius: 10px;
    outline: none;
    background: #f9fbfe;
    color: #34465d;
    font-family: inherit;
    font-size: 14px;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}

.form-group input::placeholder { color: #8998aa; }

.form-group input:hover { border-color: #c3d3e6; }

.form-group input:focus {
    border-color: var(--azul);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(30, 90, 187, 0.12);
}

/* Campo com erro vindo do servidor */
.form-group input.campo-invalido {
    border-color: var(--coral);
    background: #fff8f9;
}

.form-group input.campo-invalido:focus {
    box-shadow: 0 0 0 4px rgba(254, 82, 102, 0.14);
}

.campo-dica,
.campo-erro {
    margin: 7px 0 0;
    font-size: 12.5px;
    line-height: 1.5;
}

.campo-dica { color: var(--texto-suave); }
.campo-erro { color: #b3263a; }

/* Botão */

.btn-salvar {
    width: 100%;
    min-height: 52px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(110deg, #1e5abb, #3478d5);
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
}

.btn-salvar:hover {
    background: linear-gradient(110deg, #194b9c, #2868bd);
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(30, 90, 187, 0.22);
}

.btn-salvar:active { transform: translateY(0); }

/* Foco visível para teclado */

.especialidade-page a:focus-visible,
.especialidade-page button:focus-visible {
    outline: 3px solid rgba(30, 90, 187, 0.45);
    outline-offset: 2px;
}

/* =================================
   PAINEL INTEGRAMED
================================= */

.especialidade-brand-panel {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
    padding: 55px 45px;
    background: linear-gradient(145deg, #1e5abb 0%, #16478f 100%);
    color: #fff;
}

.brand-content { position: relative; z-index: 2; }

.brand-logo {
    width: 66px;
    height: 66px;
    margin-bottom: 36px;
}

.brand-logo svg { display: block; width: 100%; height: 100%; }

.brand-overline {
    margin: 0 0 8px;
    color: #d6e8ff;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
}

.especialidade-brand-panel h2 {
    margin: 0;
    color: #fff;
    font-size: 45px;
    font-weight: 750;
    letter-spacing: -1.5px;
}

.especialidade-brand-panel h2 span { color: #ff9aa5; }

.brand-divider {
    width: 48px;
    height: 4px;
    margin: 22px 0;
    border-radius: 5px;
    background: var(--coral);
}

.especialidade-brand-panel h3 {
    margin: 0 0 14px;
    color: #fff;
    font-size: 22px;
    font-weight: 650;
    line-height: 1.45;
}

.brand-description {
    max-width: 300px;
    margin: 0;
    color: #e3efff;
    font-size: 15px;
    line-height: 1.8;
}

/* Decoração */

.brand-decoration { position: absolute; inset: 0; pointer-events: none; }

.decoration-circle {
    position: absolute;
    display: block;
    border: 1px solid rgba(143, 198, 255, 0.25);
    border-radius: 50%;
}

.circle-one   { width: 240px; height: 240px; right: -145px; top: -120px; }
.circle-two   { width: 330px; height: 330px; right: -190px; top: -165px; }
.circle-three { width: 180px; height: 180px; left: -120px; bottom: -100px; background: rgba(143, 198, 255, 0.08); }

.brand-footer {
    position: relative;
    z-index: 2;
    margin: 55px 0 0;
    color: #d6e8ff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.6px;
}

/* =================================
   RESPONSIVIDADE
================================= */

@media (max-width: 800px) {
    .especialidade-card { grid-template-columns: 1fr; }
    .especialidade-form-area { padding: 40px 35px; }

    /* No celular o painel vira uma faixa compacta */
    .especialidade-brand-panel { padding: 30px 35px; }
    .brand-logo { width: 48px; height: 48px; margin-bottom: 16px; }
    .brand-divider,
    .especialidade-brand-panel h3,
    .brand-description { display: none; }
    .brand-footer { margin-top: 20px; }
}

@media (max-width: 480px) {
    .especialidade-page { padding: 15px; }
    .especialidade-card { border-radius: 16px; }
    .especialidade-form-area { padding: 30px 22px; }
    .form-header h1 { font-size: 26px; }
    .especialidade-brand-panel { padding: 26px 25px; }
    .especialidade-brand-panel h2 { font-size: 34px; }
}

@media (prefers-reduced-motion: reduce) {
    .especialidade-page * { transition: none !important; }
}
    </style>
</head>

<body class="especialidade-page">

    <main class="especialidade-container">

        <section class="especialidade-card">

            <div class="especialidade-form-area">

                <a class="link-voltar" th:href="@{/}">
                    <span aria-hidden="true">←</span>
                    Voltar ao início
                </a>

                <header class="form-header">
                    <span class="form-tag">IntegraMed · Especialidades</span>

                    <h1 th:text="${id == null} ? 'Nova especialidade' : 'Editar especialidade'"></h1>

                    <p th:text="${id == null}
                                ? 'Informe o nome da especialidade médica que será cadastrada.'
                                : 'Altere o nome e salve para atualizar o cadastro.'"></p>
                </header>

                <form class="especialidade-form"
                      th:object="${formulario}"
                      th:action="${id == null} ? @{/especialidades} : @{/especialidades/{id}/editar(id=${id})}"
                      method="post">

                    <div class="form-group">
                        <label for="nome">Nome da especialidade</label>

                        <input type="text"
                               id="nome"
                               th:field="*{nome}"
                               th:classappend="${#fields.hasErrors('nome')} ? 'campo-invalido'"
                               th:attr="aria-invalid=${#fields.hasErrors('nome')},aria-describedby=${#fields.hasErrors('nome')} ? 'nomeErro' : 'nomeDica'"
                               placeholder="Ex.: Cardiologia"
                               maxlength="100"
                               autocomplete="off"
                               autofocus>

                        <p class="campo-dica"
                           id="nomeDica"
                           th:unless="${#fields.hasErrors('nome')}">
                            Até 100 caracteres.
                        </p>

                        <p class="campo-erro"
                           id="nomeErro"
                           th:if="${#fields.hasErrors('nome')}"
                           th:errors="*{nome}"
                           role="alert"></p>
                    </div>

                    <button type="submit" class="btn-salvar">Salvar</button>

                </form>

            </div>

            <aside class="especialidade-brand-panel">

                <div class="brand-content">

                    <div class="brand-logo">
                        <svg
                            viewBox="0 0 100 100"
                            xmlns="http://www.w3.org/2000/svg"
                            role="img"
                            aria-label="Símbolo médico da IntegraMed">

                            <rect x="5" y="5" width="90" height="90" rx="25"
                                  fill="none" stroke="#FFFFFF" stroke-width="4"/>

                            <path d="M50 25 V75 M25 50 H75"
                                  stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>

                            <circle cx="76" cy="24" r="8" fill="#FE5266"/>
                        </svg>
                    </div>

                    <p class="brand-overline">Bem-vindo à</p>

                    <h2>Integra<span>Med</span></h2>

                    <div class="brand-divider"></div>

                    <h3>Cuidar também é conectar.</h3>

                    <p class="brand-description">
                        Mantenha as especialidades da clínica
                        organizadas em um só lugar.
                    </p>

                    <div class="brand-decoration" aria-hidden="true">
                        <span class="decoration-circle circle-one"></span>
                        <span class="decoration-circle circle-two"></span>
                        <span class="decoration-circle circle-three"></span>
                    </div>

                </div>

                <p class="brand-footer">
                    IntegraMed · Sistema de gestão clínica
                </p>

            </aside>

        </section>

    </main>

</body>
</html>
