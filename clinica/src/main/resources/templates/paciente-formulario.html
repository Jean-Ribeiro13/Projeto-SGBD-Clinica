<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

    <p th:if="${nomeRecebido != null}"
       th:text="|Dados recebidos de: ${nomeRecebido}. Ainda não gravados no banco.|">
    </p>
    <p th:if="${erro != null}"
       th:text="${erro}"
       role="alert">
    </p>
    <form th:action="@{/pacientes}"
          th:object="${formulario}"
          method="post">

        <div>
        <label for="nome">Nome</label>
        <input type="text" id="nome"
               th:field="*{nome}"
               maxlength="100" required>
            <p th:if="${#fields.hasErrors('nome')}"
               th:errors="*{nome}">
            </p>
        </div>

        <div>
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf"
                   th:field="*{cpf}"
                   maxlength="11" required>
            <p th:if="${#fields.hasErrors('cpf')}"
               th:errors="*{cpf}">
            </p>
        </div>

        <div>
            <label for="dataNascimento">Data de nascimento:</label>
            <input type="date" id="dataNascimento"
                   th:field="*{dataNascimento}">
        </div>

        <button type="submit">Salvar</button>
    </form>
</body>
</html>
