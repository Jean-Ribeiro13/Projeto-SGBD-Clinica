<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="|Cadastrar ${titulo}|">Cadastro</title>
</head>
<body>
<h1 th:text="|${id != null ? 'Editar' : 'Cadastrar'} ${titulo}|">
    Profissional
</h1>
<p th:if="${erro != null}"
   th:text="${erro}"
   role="alert">
</p>
<form th:object="${formulario}"
       th:action="@{${(tipo == 'profissional' ? '/profissionais' : '/' + tipo)
          + (id != null ? '/' + id + '/editar' : '')}}"
       method="post">
    <div>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" th:field="*{nome}"
               maxlength="100" required>

        <p th:if="${#fields.hasErrors('nome')}"
           th:errors="*{nome}"></p>
    </div>

    <div>
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" th:field="*{cpf}"
               maxlength="11" required>

        <p th:if="${#fields.hasErrors('cpf')}"
           th:errors="*{cpf}"></p>
    </div>

    <div>
        <label for="dataNascimento">Data de nascimento:</label>
        <input type="date" id="dataNascimento"
               th:field="*{dataNascimento}" required>

        <p th:if="${#fields.hasErrors('dataNascimento')}"
           th:errors="*{dataNascimento}"></p>
    </div>
    <div th:if="${tipo == 'medico' or tipo == 'enfermeiro'}">
        <label for="registro"
               th:text="${tipo == 'medico' ? 'CRM:' : 'COREN:'}">
        </label>

        <input type="text" id="registro"
               th:field="*{registro}"
               maxlength="20" required>

        <p th:if="${#fields.hasErrors('registro')}"
           th:errors="*{registro}"></p>
    </div>
    <div th:if="${tipo == 'medico'}">
        <label for="supervisorId">Médico supervisor:</label>

        <select id="supervisorId" th:field="*{supervisorId}">
            <option value="">Sem supervisor</option>

            <option th:each="supervisor : ${supervisores}"
                    th:value="${supervisor.id()}"
                    th:text="${supervisor.nome()}">
            </option>
        </select>

        <p th:if="${#fields.hasErrors('supervisorId')}"
           th:errors="*{supervisorId}"></p>
    </div>

    <button type="submit">Salvar</button>
</form>

<a th:href="@{/profissionais}">Voltar aos profissionais</a>
</body>
</html>
