<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resumo de consultas</title>
</head>
<body>

<a th:href="@{/}">Voltar ao início</a>

<h1>Resumo de consultas por médico</h1>

<form th:action="@{/consultas/resumo/pesquisar}"
      th:object="${filtro}"
      method="get">

    <div>
        <label for="idMedico">Médico:</label>
        <select id="idMedico" th:field="*{idMedico}">
            <option value="">Todos os médicos</option>
            <option th:each="medico : ${medicos}"
                    th:value="${medico.id()}"
                    th:text="|${medico.nome()} — ${medico.registro()}|">
            </option>
        </select>

        <p th:if="${#fields.hasErrors('idMedico')}"
           th:errors="*{idMedico}"
           role="alert"></p>
    </div>

    <div>
        <label for="dataInicial">Data inicial:</label>
        <input type="date" id="dataInicial"
               th:field="*{dataInicial}" required>

        <p th:if="${#fields.hasErrors('dataInicial')}"
           th:errors="*{dataInicial}"
           role="alert"></p>
    </div>

    <div>
        <label for="dataFinal">Data final:</label>
        <input type="date" id="dataFinal"
               th:field="*{dataFinal}" required>

        <p th:if="${#fields.hasErrors('dataFinal')}"
           th:errors="*{dataFinal}"
           role="alert"></p>
    </div>

    <button type="submit">Pesquisar</button>
</form>

<section th:if="${pesquisado}">
    <h2>Resultado</h2>

    <p>Os valores representam a soma dos valores registrados nas consultas,
        não pagamentos recebidos.</p>

    <p th:if="${#lists.isEmpty(resumos)}">
        Nenhum médico encontrado para os filtros informados.
    </p>

    <table th:unless="${#lists.isEmpty(resumos)}">
        <thead>
        <tr>
            <th scope="col">Médico</th>
            <th scope="col">CRM</th>
            <th scope="col">Quantidade de consultas</th>
            <th scope="col">Valor total (R$)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="resumo : ${resumos}">
            <td th:text="${resumo.nomeMedico()}"></td>
            <td th:text="${resumo.crm()}"></td>
            <td th:text="${resumo.quantidadeConsultas()}"></td>
            <td th:text="${#numbers.formatDecimal(
                resumo.valorTotal(), 1, 'POINT', 2, 'COMMA')}"></td>
        </tr>
        </tbody>
    </table>
</section>

</body>
</html>
